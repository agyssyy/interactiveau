<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOS 21">
<title>KOS 21 — PENGHUNI KELIMA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261025ah">
</head>
<body>
<div id="stage">
  <div id="phone">
   <div id="screen">

    <div id="sb">
      <b id="clk">03.00</b>
      <span class="r">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="net">4G</span>
        <span class="bat"><i style="width:9%"></i><b>9</b></span>
      </span>
    </div>
    <div id="isl"></div>

    <!-- ================= LOCK ================= -->
    <section class="scr on" id="lock">
      <div class="lk-wall" id="lkWall"></div>
      <div class="lk-door"></div>
      <div class="lk-shade"></div>
      <div class="lk-head">
        <span class="lk-eyebrow">KOS 21 <i>/</i> RUMAH 21</span>
        <span class="lk-lock">⌂</span>
      </div>
      <div class="lk-clock">
        <div class="lk-time" id="lkTime">03.00</div>
        <div class="lk-date" id="lkDate">Rabu, 4 November</div>
      </div>
      <div class="lk-cond"><b>12°</b><span>hujan deras · Sukamaju</span></div>
      <div class="lk-rule"><i></i></div>
      <div class="lk-meta">4 kamar · 4 nama · <em>1 pintu lagi</em></div>
      <div class="lk-notifs" id="lkNotifs"></div>
      <div class="lk-brand">PENGHUNI KELIMA<small>sebuah AU interaktif</small></div>
      <div class="lk-hint" id="lkHint"><b>⌃</b> geser ke atas</div>
      <div class="lk-actions"><div class="lk-act">⚡</div><div class="lk-act">◉</div></div>
    </section>

    <!-- ================= PASSCODE ================= -->
    <section class="scr" id="pass">
      <div class="ps-top">
        <div class="ps-icon">⌂</div>
        <h3>Masukkan Kode</h3>
        <p id="passHint">4 angka</p>
        <div id="dots"><i></i><i></i><i></i><i></i></div>
      </div>
      <div id="pad"></div>
      <div class="ps-foot"><span>Darurat</span><span id="passCancel">Batal</span></div>
    </section>

    <!-- ================= HOME ================= -->
    <section class="scr" id="home">
      <div class="hm-wall" id="hmWall"></div>
      <div class="hm-shade"></div>
      <div class="hm-widget">
        <div class="w-top">
          <span>RABU</span><span>4 NOVEMBER</span>
        </div>
        <div class="w-temp">12°<small>Sukamaju</small></div>
        <div class="w-line">Hujan deras diperkirakan 3 hari.</div>
      </div>
      <div class="hm-grid" id="hmGrid"></div>
      <div class="hm-dots"><i class="on"></i><i></i></div>
      <div class="hm-dock" id="hmDock"></div>
    </section>

    <!-- ================= APP ================= -->
    <section class="scr app" id="app">
      <header id="appBar"></header>
      <div id="appBody"></div>
      <div id="appFoot"></div>
    </section>

    <!-- ================= OVERLAYS ================= -->
    <div id="banner"></div>
    <div id="callScr"></div>
    <div id="endScr"></div>
    <div id="modal"></div>
    <div id="fx">
      <div class="grain" id="grain"></div>
      <div class="scan"></div>
      <div class="vig"></div>
      <div class="black" id="black"></div>
      <div class="red" id="red"></div>
    </div>

    <div id="homebar"></div>
   </div>

   <span class="side mute"></span>
   <span class="side vup"></span>
   <span class="side vdn"></span>
   <span class="side pwr"></span>
  </div>
</div>

<script src="suara/daftar.js"></script>
<script src="data.js?v=20261025ah"></script>
<script src="app.js?v=20261025ah"></script>
</body>
</html>
