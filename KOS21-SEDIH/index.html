<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KOSONG">
<meta name="description" content="KOSONG — AU sedih dari KOS 21. Malam terakhir lima orang di rumah 21.">
<title>KOSONG — KOS 21</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261028c">
</head>
<body>
<div id="stage">
  <div id="phone">
   <div id="screen">

    <div id="sb">
      <b id="clk">21.00</b>
      <span class="r">
        <span class="sig"><i></i><i></i><i></i><i></i></span>
        <span class="net">4G</span>
        <span class="bat"><i style="width:63%"></i><b>63</b></span>
      </span>
    </div>
    <div id="isl"></div>

    <!-- ================= LOCK ================= -->
    <section class="scr on" id="lock">
      <div class="lk-wall" id="lkWall"></div>
      <div class="lk-door"></div>
      <div class="lk-shade"></div>
      <div class="lk-head">
        <span class="lk-eyebrow">KOS 21 <i>/</i> RUMAH 21</span>
        <span class="lk-lock">⌂</span>
      </div>
      <div class="lk-clock">
        <div class="lk-time" id="lkTime">21.00</div>
        <div class="lk-date" id="lkDate">Sabtu, 27 Februari</div>
      </div>
      <div class="lk-cond"><b>19°</b><span>gerimis · Sukamaju</span></div>
      <div class="lk-rule"><i></i></div>
      <div class="lk-meta">5 kamar · 5 nama · <em>malam terakhir</em></div>
      <div class="lk-notifs" id="lkNotifs"></div>
      <div class="lk-brand">KOSONG<small>sebuah AU sedih · KOS 21</small></div>
      <div class="lk-hint" id="lkHint"><b>^</b> geser ke atas</div>
      <div class="lk-actions"><div class="lk-act">⌂</div><div class="lk-act">⌕</div></div>
    </section>

    <!-- ================= PASSCODE ================= -->
    <section class="scr" id="pass">
      <div class="ps-top">
        <div class="ps-icon">⌂</div>
        <h3>Masukkan Kode</h3>
        <p id="passHint">4 angka</p>
        <div id="dots"><i></i><i></i><i></i><i></i></div>
      </div>
      <div id="pad"></div>
      <div id="passFoot"><span>Darurat</span><span id="passCancel">Batal</span></div>
    </section>

    <!-- ================= HOME ================= -->
    <section class="scr" id="home">
      <div class="hm-wall" id="hmWall"></div>
      <div class="hm-shade"></div>
      <div class="hm-widget">
        <div class="w-top">
          <span>SABTU</span><span>27 FEBRUARI</span>
        </div>
        <div class="w-temp">19°<small>Sukamaju</small></div>
        <div class="w-line">Gerimis. Katanya hujan sampai pagi.</div>
      </div>
      <div class="hm-grid" id="hmGrid"></div>
      <div class="hm-dots"><i class="on"></i><i></i></div>
      <div class="hm-dock" id="hmDock"></div>
    </section>

    <!-- ================= APP ================= -->
    <section class="scr app" id="app">
      <header id="appBar"></header>
      <div id="appBody"></div>
      <div id="appFoot"></div>
    </section>

    <!-- ================= OVERLAYS ================= -->
    <div id="banner"></div>
    <div id="callScr"></div>
    <div id="endScr"></div>
    <div id="modal"></div>
    <div id="fx">
      <div class="grain" id="grain"></div>
      <div class="scan"></div>
      <div class="vig"></div>
      <div class="black" id="black"></div>
      <div class="red" id="red"></div>
    </div>

    <div id="homebar"></div>
   </div>

   <span class="side mute"></span>
   <span class="side vup"></span>
   <span class="side vdn"></span>
   <span class="side pwr"></span>
  </div>
</div>

<script src="data.js?v=20261028c"></script>
<script src="app.js?v=20261028c"></script>
</body>
</html>
